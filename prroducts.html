<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing | Shop</title>
    <link rel="stylesheet" href="styleko.css">
</head>

<body>
    <header>
        <div class="logo">Shop</div>
        <nav>
            <ul>
                <li><a href="landing.html">Home</a></li>
                <li><a href="#.html">Clothing</a></li>
                <li><a href="#.html">Shoes</a></li>
                <li><a href="#.html">Contact Us</a></li>
                <li><a href="Cart.html">Cart <span class="cart-count">0</span></a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>All Products</h1>

        <div class="products-container">
            <aside aria-labelledby="filter">
                <h2 id="filter">Filter Products</h2>
                <form>
                    <p><strong>Category</strong></p>
                    <label><input type="checkbox" name="category" value="clothing"> Clothing</label>
                    <label><input type="checkbox" name="category" value="shoes"> Shoes</label>

                    <p><strong>Price Range</strong></p>
                    <label><input type="radio" name="price" value="25to50"> ₱25 – ₱50</label>
                    <label><input type="radio" name="price" value="50to100"> ₱50 – ₱100</label>
                    <label><input type="radio" name="price" value="higher than 100"> ₱100 – ₱500</label>

                    <button type="submit">Apply Filters</button>
                </form>
            </aside>

            <section class="product-list">
                <!-- Products will be injected here by JS -->
            </section>
        </div>
    </main>

    <script src="1.js"></script>
</body>

</html>
