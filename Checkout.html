<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout & Shipping | Shop</title>
    <link rel="stylesheet" href="styleko.css">
</head>

<body>
    <header>
        <div class="logo">Shop ni Denzel</div>
        <nav>
            <ul>
                <li><a href="prroducts.html">Home</a></li>
                <li><a href="#.html">Clothing</a></li>
                <li><a href="#.html">Shoes</a></li>
                <li><a href="#.html">Contact Us</a></li>
                <li><a href="Cart.html">Cart <span class="cart-count">0</span></a></li>
            </ul>
        </nav>
    </header>

    <div class="checkout-wrapper">
        <main>
            <section>
                <h2>Shipping Information</h2>
                <fieldset>
                    <legend>Shipping Address</legend>
                    <label>Full Name <input type="text" placeholder=""></label>
                    <label>Street Address <input type="text" placeholder=""></label>
                    <label>Address details <input type="text" placeholder=""></label>
                </fieldset>
            </section>

            <section>
                <h2>Payment Method</h2>
                <form>
                    <label><input type="radio" name="payment" checked> COD</label>
                    <label><input type="radio" name="payment"> GCash</label>
                    <button type="button" class="place-order">Place order</button>
                </form>
            </section>
        </main>

        <aside>
            <h3>Order Summary</h3>
            <p>Items Total: ₱<span class="items-total">0.00</span></p>
            <p>Shipping: ₱<span class="shipping">150.00</span></p>
            <hr>
            <p><strong>Total: ₱<span class="total">0.00</span></strong></p>
        </aside>
    </div>

    <script src="1.js"></script>
</body>

</html>
